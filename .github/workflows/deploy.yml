name: Deploy Sid360

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Branix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_BRANIX }}

      - name: Testar conexão SSH
        env:
          HOST: ${{ secrets.HOST_BRANIX }}
          SSH_PORT: ${{ secrets.SSH_PORT_BRANIX }}
        run: |
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.USERNAME_BRANIX }}@$HOST "echo Conexão SSH OK"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências npm
        run: npm ci

      - name: Build frontend (Vue)
        run: npm run build

      - name: Remover node_modules
        run: rm -rf node_modules

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Instalar dependências Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Preparar pacote de deploy
        run: |
          echo "Empacotando para deploy..."
          zip -r deployment.zip . \
            -x "*.git*" \
            -x "deployment*.zip" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".env*" \
            -x "*.md"
          echo "Pacote criado:"
          ls -lh deployment.zip

      - name: Upload para Branix
        env:
          HOST: ${{ secrets.HOST_BRANIX }}
          USERNAME: ${{ secrets.USERNAME_BRANIX }}
          SSH_PORT: ${{ secrets.SSH_PORT_BRANIX }}
        run: |
          scp -P $SSH_PORT -o StrictHostKeyChecking=no deployment.zip $USERNAME@$HOST:~/

      - name: Extrair e ativar no servidor
        env:
          HOST: ${{ secrets.HOST_BRANIX }}
          USERNAME: ${{ secrets.USERNAME_BRANIX }}
          SSH_PORT: ${{ secrets.SSH_PORT_BRANIX }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIRECTORY_BRANIX }}
        run: |
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no $USERNAME@$HOST << 'EOF'
            set -e

            echo "Iniciando deploy em $DEPLOY_DIR..."
            mkdir -p $DEPLOY_DIR

            mv ~/deployment.zip $DEPLOY_DIR/
            cd $DEPLOY_DIR

            # Preservar .env antes de extrair
            if [ -f .env ]; then
              cp .env /tmp/.env.backup
            fi

            unzip -o deployment.zip
            rm deployment.zip

            # Restaurar .env
            if [ -f /tmp/.env.backup ]; then
              cp /tmp/.env.backup .env
              rm /tmp/.env.backup
            fi

            # Laravel artisan
            php artisan optimize:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force

            echo "Deploy concluído com sucesso."
          EOF

      - name: Notificar conclusão
        run: echo "Deploy para sid360.com.br concluído."